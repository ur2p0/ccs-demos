# Le service de commandes : la même image que l'API, mais avec de la mémoire.
# C'est le contraste avec shopix-api (éphémère) qui porte la leçon du stockage.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shopix-commandes
  namespace: shopix
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: { storage: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopix-commandes
  namespace: shopix
  labels: { app: shopix, composant: commandes }
spec:
  replicas: 1
  strategy: { type: Recreate }   # un seul lecteur/écrivain sur un volume RWO
  selector:
    matchLabels: { app: shopix, composant: commandes }
  template:
    metadata:
      labels: { app: shopix, composant: commandes }
    spec:
      # En local, le volume est un répertoire du nœud : le Pod doit revenir sur CE nœud.
      # L'overlay Scaleway retire ce nodeSelector — le disque réseau, lui, suit le Pod.
      nodeSelector: { stockage: "oui" }
      containers:
        - name: commandes
          image: shopix:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080, name: http }]
          env:
            - { name: ROLE, value: api }
            - { name: DATA_DIR, value: /data }
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: NODE_NAME, valueFrom: { fieldRef: { fieldPath: spec.nodeName } } }
            - { name: POD_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
            - { name: POD_IP, valueFrom: { fieldRef: { fieldPath: status.podIP } } }
          envFrom:
            - configMapRef: { name: shopix-config }
            - secretRef: { name: shopix-paiement }
          volumeMounts:
            - { name: donnees, mountPath: /data }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 192Mi }
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: donnees
          persistentVolumeClaim: { claimName: shopix-commandes }
---
apiVersion: v1
kind: Service
metadata:
  name: shopix-commandes
  namespace: shopix
  # app: shopix est ce que le ServiceMonitor sélectionne : sans cette étiquette,
  # Prometheus ne collecte pas les métriques du service de commandes.
  labels: { app: shopix, composant: commandes }
spec:
  selector: { app: shopix, composant: commandes }
  ports: [{ port: 8080, targetPort: http, name: http }]

apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopix-front
  namespace: shopix
  labels: { app: shopix, composant: front }
spec:
  replicas: 2
  selector:
    matchLabels: { app: shopix, composant: front }
  template:
    metadata:
      labels: { app: shopix, composant: front }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: front
          image: shopix:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080, name: http }]
          env:
            - { name: ROLE, value: front }
            - { name: API_URL, value: "http://shopix-api:8080" }
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: NODE_NAME, valueFrom: { fieldRef: { fieldPath: spec.nodeName } } }
            - { name: POD_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
            - { name: POD_IP, valueFrom: { fieldRef: { fieldPath: status.podIP } } }
          envFrom:
            - configMapRef: { name: shopix-config }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 192Mi }
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 2
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 3
            failureThreshold: 1
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
---
apiVersion: v1
kind: Service
metadata:
  name: shopix-front
  namespace: shopix
  labels: { app: shopix, composant: front }
spec:
  selector: { app: shopix, composant: front }
  ports: [{ port: 8080, targetPort: http, name: http }]

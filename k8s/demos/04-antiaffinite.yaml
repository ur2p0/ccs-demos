# Anti-affinité stricte : deux réplicas ne peuvent jamais partager un nœud.
# Avec 2 nœuds et 3 réplicas, le troisième attend indéfiniment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopix-etale
  namespace: shopix
  labels: { app: shopix, composant: etale }
spec:
  replicas: 3
  selector:
    matchLabels: { app: shopix, composant: etale }
  template:
    metadata:
      labels: { app: shopix, composant: etale }
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { composant: etale }
              topologyKey: kubernetes.io/hostname
      containers:
        - name: api
          image: shopix:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - { name: ROLE, value: api }
            - { name: DATA_DIR, value: /tmp/shopix }
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 192Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }

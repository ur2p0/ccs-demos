# Zero-Trust, étape 1 : plus personne n'entre chez l'API.
# (Le front reste joignable depuis le navigateur — c'est son appel à l'API qui tombe.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-deny-all
  namespace: shopix
spec:
  podSelector:
    matchLabels: { composant: api }
  policyTypes: ["Ingress"]
  # Aucune règle d'entrée = tout est refusé.

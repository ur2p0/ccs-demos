# Le même déploiement, avec le laissez-passer : il peut accoster au quai réservé.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopix-paiement
  namespace: shopix
  labels: { app: shopix, composant: paiement }
spec:
  replicas: 1
  selector:
    matchLabels: { app: shopix, composant: paiement }
  template:
    metadata:
      labels: { app: shopix, composant: paiement }
    spec:
      nodeSelector: { zone: paiement }
      tolerations:
        - key: paiement
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: api
          image: shopix:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - { name: ROLE, value: api }
            - { name: DATA_DIR, value: /tmp/shopix }
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 192Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shopix
resources:
  - ../../base
# En local l'image est chargée dans le cluster par « minikube image load » :
# elle n'existe dans aucun registre, il ne faut donc jamais tenter de la tirer.
images:
  - name: shopix
    newTag: 1.0.0
patches:
  - target: { kind: Deployment }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never

apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopix-api-test
  labels: 
    env: test
    app: shopix
    tier: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: shopix
      tier: api 
  template:
    metadata:
      labels:
        app: shopix
        tier: api 
    spec:
      containers:
      - name: shopix-api
        image: shopix:1.0.0
        ports:
        - containerPort: 8080

